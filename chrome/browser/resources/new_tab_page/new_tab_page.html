<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Flex</title>
  <style>
    body {
      background-color: #0d0d0d;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }
    h1 {
      font-size: 5rem;
      font-weight: 800;
      letter-spacing: -2px;
      background: linear-gradient(90deg, #ff00cc, #3333ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 20px;
    }
    .search-box {
      width: 40%;
      min-width: 400px;
      padding: 15px 25px;
      font-size: 1.2rem;
      border: 1px solid #333;
      border-radius: 30px;
      background: #1a1a1a;
      color: #fff;
      outline: none;
      transition: all 0.3s ease;
    }
    .search-box:focus {
      border-color: #ff00cc;
      box-shadow: 0 0 20px rgba(255, 0, 204, 0.2);
    }
    .footer {
      position: absolute;
      bottom: 20px;
      font-size: 0.8rem;
      color: #666;
    }
  </style>
</head>
<body>
  <h1>Flex</h1>
  <input type="text" class="search-box" placeholder="Search the web or enter a URL..." autofocus>
  <div class="footer">Zero Telemetry. 1000% Private.</div>
</body>
</html>
