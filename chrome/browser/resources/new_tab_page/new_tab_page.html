<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Flex</title>
  <style>
    :root {
      --bg-color: #050505;
      --glow-1: rgba(147, 51, 234, 0.15);
      --glow-2: rgba(59, 130, 246, 0.15);
      --glass-bg: rgba(20, 20, 20, 0.6);
      --glass-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #64748b;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Ambient background glow (GPU accelerated, very cheap) */
    .ambient-bg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100vw;
      height: 100vh;
      background: 
        radial-gradient(circle at 30% 40%, var(--glow-1) 0%, transparent 50%),
        radial-gradient(circle at 70% 60%, var(--glow-2) 0%, transparent 50%);
      z-index: 0;
      pointer-events: none;
      animation: pulse 15s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      0% { opacity: 0.7; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
    }

    /* Core container */
    .container {
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 600px;
      padding: 2rem;
    }

    /* Sleek Typography */
    h1 {
      font-size: 4rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      margin-bottom: 2.5rem;
      background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      user-select: none;
    }

    /* Glassmorphism Search Bar */
    .search-wrapper {
      width: 100%;
      position: relative;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .search-wrapper:focus-within {
      transform: translateY(-2px);
    }

    .search-box {
      width: 100%;
      padding: 1.2rem 2rem;
      font-size: 1.1rem;
      font-weight: 500;
      color: var(--text-main);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      outline: none;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .search-box::placeholder {
      color: var(--text-muted);
      font-weight: 400;
    }

    .search-box:hover {
      background: rgba(30, 30, 30, 0.7);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .search-box:focus {
      background: rgba(40, 40, 40, 0.8);
      border-color: rgba(147, 51, 234, 0.5);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), 0 0 0 4px rgba(147, 51, 234, 0.1);
    }

    /* Minimal footer */
    .footer {
      position: absolute;
      bottom: 2rem;
      display: flex;
      gap: 1rem;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.02em;
      z-index: 1;
      user-select: none;
    }

    .badge {
      padding: 4px 12px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }

    .badge:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
    }
  </style>
</head>
<body>
  <div class="ambient-bg"></div>
  
  <div class="container">
    <h1>Flex</h1>
    <div class="search-wrapper">
      <input type="text" class="search-box" placeholder="Search the web securely..." autofocus autocomplete="off" spellcheck="false">
    </div>
  </div>

  <div class="footer">
    <div class="badge">Zero Telemetry</div>
    <div class="badge">1000% Private</div>
  </div>
</body>
</html>
