<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Vanta</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: #0a0a0b;
      color: #f1f2f4;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .wordmark {
      font-size: 3.5rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 1.75rem;
      color: #f1f2f4;
      user-select: none;
    }
    .search {
      width: min(560px, 80vw);
      padding: 0.9rem 1.1rem;
      font-size: 1rem;
      color: #f1f2f4;
      background: #161617;
      border: 1px solid #2a2a2c;
      border-radius: 8px;
      outline: none;
      transition: border-color 120ms ease;
    }
    .search::placeholder { color: #6b7280; }
    .search:focus { border-color: #3a3a3d; }
    .motto {
      position: fixed;
      bottom: 1.5rem;
      font-size: 0.8rem;
      color: #6b7280;
      letter-spacing: 0.02em;
      user-select: none;
    }
  </style>
</head>
<body>
  <div class="wordmark">Vanta</div>
  <input type="text" class="search" placeholder="Search the web or enter a URL" autofocus autocomplete="off" spellcheck="false">
  <div class="motto">Nothing escapes.</div>
</body>
</html>
